services:
  - type: web
    name: whatsapp-manager
    runtime: node
    plan: free
    buildCommand: |
      npm install
      mkdir -p sessions uploads media temp qr-codes
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BASE_URL
        fromService:
          name: whatsapp-manager
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
