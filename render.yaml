services:
  - type: web
    name: whatsapp-manager
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    buildCommand: |
      echo "🚀 Installing dependencies..."
      npm install --legacy-peer-deps --build-from-source=false
      echo "✅ Dependencies installed"
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NPM_CONFIG_LEGACY_PEER_DEPS
        value: true
      - key: NPM_CONFIG_BUILD_FROM_SOURCE
        value: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
