services:
  - type: web
    name: whatsapp-manager
    runtime: node
    plan: free
    buildCommand: |
      echo "🚀 Starting build process..."
      node --version
      npm --version
      npm install --legacy-peer-deps
      npm run build
      echo "✅ Build completed successfully!"
    startCommand: |
      echo "🚀 Starting application..."
      npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BASE_URL
        fromService:
          name: whatsapp-manager
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NPM_CONFIG_LEGACY_PEER_DEPS
        value: true
    healthCheckPath: /
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
